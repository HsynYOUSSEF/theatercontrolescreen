<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theater Screen</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;width:100vw;height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;}
  #standby{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.6s ease;}
  .standby-id{font-size:clamp(60px,12vw,120px);font-weight:700;color:#fff;opacity:0.08;letter-spacing:-0.02em;}
  .standby-dot{width:10px;height:10px;border-radius:50%;background:#333;animation:pulse 2s infinite;}
  .standby-dot.connected{background:#3B6D11;animation:pulse-green 2s infinite;}
  @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
  @keyframes pulse-green{0%,100%{opacity:0.5}50%{opacity:1}}
  #display{position:absolute;inset:0;opacity:0;transition:opacity 0.8s ease;display:flex;align-items:center;justify-content:center;}
  #display.visible{opacity:1;}
  #display img{width:100%;height:100%;object-fit:cover;}
  #display video{width:100%;height:100%;object-fit:cover;display:block;}
  .announcement{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px;}
  .announcement .eyebrow{font-size:clamp(14px,2vw,22px);font-weight:500;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:24px;opacity:0.7;}
  .announcement h1{font-size:clamp(36px,7vw,96px);font-weight:700;line-height:1.05;letter-spacing:-0.02em;margin-bottom:32px;}
  .announcement p{font-size:clamp(16px,2.5vw,32px);line-height:1.5;opacity:0.75;max-width:700px;}
  .custom-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .theme-crimson{background:#1a0608;color:#fff;}.theme-crimson .eyebrow{color:#e05a6a;}
  .theme-ocean{background:#020e1f;color:#fff;}.theme-ocean .eyebrow{color:#4da6e8;}
  .theme-forest{background:#040f07;color:#fff;}.theme-forest .eyebrow{color:#5cbe7a;}
  .theme-amber{background:#140b00;color:#fff;}.theme-amber .eyebrow{color:#f4a030;}
  .theme-violet{background:#0c0818;color:#fff;}.theme-violet .eyebrow{color:#a07ce8;}
  .theme-slate{background:#080c10;color:#fff;}.theme-slate .eyebrow{color:#7ab4d4;}
  .theme-rose{background:#160510;color:#fff;}.theme-rose .eyebrow{color:#e87cad;}
  #screenLabel{position:fixed;bottom:16px;right:20px;font-size:13px;color:rgba(255,255,255,0.2);letter-spacing:0.1em;}
  #connIndicator{position:fixed;top:14px;right:16px;width:8px;height:8px;border-radius:50%;background:#333;transition:background 0.4s;}
  #connIndicator.on{background:#3B6D11;}
  #videoSpinner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000;}
  #videoSpinner.show{display:flex;}
  .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:rgba(255,255,255,0.6);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* Screen share */
  #shareDisplay{position:fixed;inset:0;z-index:999;background:#000;display:none;}
  #shareDisplay.visible{display:block;}
  #shareVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000;}

  .share-badge{position:fixed;top:14px;left:16px;background:rgba(92,190,122,0.2);border:1px solid rgba(92,190,122,0.4);color:#5cbe7a;font-size:11px;padding:4px 10px;border-radius:100px;letter-spacing:0.05em;z-index:1000;}
</style>
</head>
<body>
<div id="standby">
  <div class="standby-id" id="standbyId">—</div>
  <div class="standby-dot" id="standbyDot"></div>
</div>
<div id="display"></div>
<div id="videoSpinner"><div class="spinner"></div></div>
<div id="shareDisplay">
  <img id="shareImg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;">
  <video id="shareVideo" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;background:#000"></video>
</div>

<div id="screenLabel"></div>
<div id="connIndicator"></div>

<script>
  const screenId = window.location.pathname.split('/').pop() || 'A1';
  const SERVER_HOST = window.location.host;

  document.getElementById('standbyId').textContent = screenId;
  document.getElementById('screenLabel').textContent = screenId;

  const display  = document.getElementById('display');
  const standby  = document.getElementById('standby');
  const dot      = document.getElementById('standbyDot');
  const connInd  = document.getElementById('connIndicator');
  const shareDisplay = document.getElementById('shareDisplay');
  const shareImg = document.getElementById('shareImg');

  let ws, currentVideo = null, frameCount = 0;

  function connect() {
    ws = new WebSocket('ws://' + SERVER_HOST + '?type=screen&screenId=' + screenId);
    ws.binaryType = 'arraybuffer';
    ws.onopen  = () => { dot.classList.add('connected'); connInd.classList.add('on'); };
    ws.onclose = () => { dot.classList.remove('connected'); connInd.classList.remove('on'); setTimeout(connect, 3000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      // Binary = JPEG frame
      if (e.data instanceof ArrayBuffer) {
        if (shareDisplay.style.display !== 'block') startShareReceive();
        const blob = new Blob([e.data], { type: 'image/jpeg' });
        const url = URL.createObjectURL(blob);
        const old = shareImg.src;
        shareImg.src = url;
        if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
        frameCount++;
        const badge = document.getElementById('shareBadge');
        if (badge) badge.textContent = '⬡ Live Share · ' + frameCount + ' frames';
        return;
      }
      // Text = JSON
      try {
        const msg = JSON.parse(e.data);
        if (msg.action === 'launch')      showContent(msg.content, msg.theme);
        if (msg.action === 'clear')       clearDisplay();
        if (msg.action === 'share-start') startShareReceive();
        if (msg.action === 'share-stop')  stopShare();
      } catch(e) {}
    };
  }

  function startShareReceive() {
    shareDisplay.style.cssText = 'position:fixed;inset:0;z-index:999;background:#000;display:block;';
    shareImg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;';
    display.classList.remove('visible');
    standby.style.display = 'none';
    standby.style.opacity = '0';
    if (!document.getElementById('shareBadge')) {
      const b = document.createElement('div');
      b.id = 'shareBadge'; b.className = 'share-badge'; b.textContent = '⬡ Live Share';
      document.body.appendChild(b);
    }
  }

  function stopShare() {
    shareDisplay.style.display = 'none';
    shareImg.src = '';
    frameCount = 0;
    document.getElementById('shareBadge')?.remove();
    if (display.innerHTML && display.innerHTML.trim()) {
      display.classList.add('visible');
    } else {
      standby.style.display = 'flex';
      setTimeout(() => standby.style.opacity = '1', 50);
    }
  }

  function showContent(content, theme) {
    if (!content) return;
    if (currentVideo) { currentVideo.pause(); currentVideo.src = ''; currentVideo = null; }
    display.innerHTML = ''; display.classList.remove('visible');
    stopShare();

    if (content.type === 'image') {
      const img = document.createElement('img');
      img.src = content.url; img.onload = fadeIn; img.onerror = fadeIn;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
      display.appendChild(img);
    } else if (content.type === 'video') {
      const video = document.createElement('video');
      video.autoplay = true; video.loop = true; video.muted = true; video.playsInline = true;
      video.preload = 'auto'; // preload entire video
      video.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      video.oncanplaythrough = () => { // wait until enough data buffered for smooth play
        // Sync to correct position if startTime provided
        if (content.startTime) {
          const elapsed = (Date.now() - content.startTime) / 1000;
          if (video.duration && elapsed < video.duration) {
            video.currentTime = elapsed % video.duration;
          }
        }
        video.play().catch(()=>{});
        fadeIn();
      };
      video.onerror = fadeIn;
      video.src = content.url; video.load();
      display.appendChild(video); currentVideo = video;
    } else if (content.type === 'announcement') {
      const div = document.createElement('div');
      div.className = 'announcement theme-' + (theme || 'slate');
      div.innerHTML = (content.eyebrow ? '<div class="eyebrow">' + content.eyebrow + '</div>' : '') +
        '<h1>' + (content.headline || '') + '</h1>' +
        (content.body ? '<p>' + content.body + '</p>' : '');
      display.appendChild(div); fadeIn();
    } else if (content.type === 'custom') {
      const div = document.createElement('div');
      div.className = 'custom-wrap'; div.innerHTML = content.html;
      display.appendChild(div); fadeIn();
    }
    standby.style.opacity = '0';
    setTimeout(() => { standby.style.display = 'none'; }, 400);
  }

  function fadeIn() { display.classList.add('visible'); }

  function clearDisplay() {
    if (currentVideo) { currentVideo.pause(); currentVideo.src = ''; currentVideo = null; }
    stopShare();
    display.classList.remove('visible');
    setTimeout(() => { display.innerHTML = ''; }, 800);
    standby.style.display = 'flex';
    setTimeout(() => standby.style.opacity = '1', 50);
  }

  connect();
</script>
</body>
</html>
